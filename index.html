<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    /* Set theme before first paint: stored choice, else system setting. */
    (function () {
      var d = document.documentElement, t;
      d.classList.add('js');
      try { t = localStorage.getItem('ak-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      d.setAttribute('data-theme', t);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anurag Kumawat — Software Engineer</title>
  <meta name="description" content="Anurag Kumawat, Software Engineer at ColoredCow. I build software from zero and take it to real users — three production systems built and launched.">
  <meta name="theme-color" content="#f5f2ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1411" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="alternate icon" href="assets/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="js/theme.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-nav">
    <nav class="container nav-inner" aria-label="Main">
      <a class="brand" href="#hero" aria-label="Anurag Kumawat — home">
        <svg class="logo" viewBox="30 70 160 75" fill="none" aria-hidden="true">
          <clipPath id="ak-feet"><rect x="0" y="0" width="216" height="134.5"/></clipPath>
          <path class="logo-a" clip-path="url(#ak-feet)" d="M50 142 L89.5 91 L129 142" stroke="currentColor" stroke-width="19" stroke-linejoin="round"/>
          <path class="logo-k" d="M148 81 L176 81 L132 106 L173 134.5 L144 134.5 L117 103 Z" fill="currentColor"/>
        </svg>
      </a>
      <div class="nav-right">
        <ul class="nav-links">
          <li><a href="#work">Work</a></li>
          <li><a href="#skills">Skills</a></li>
          <li><a href="#journey">Journey</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
        <button id="theme-toggle" class="theme-switch" type="button" aria-pressed="false" aria-label="Switch to dark theme">
          <span class="knob">
            <svg class="switch-glyph" viewBox="0 0 24 24" aria-hidden="true"><path class="switch-peak" d="M4 17 L12 7 L20 17"/></svg>
          </span>
        </button>
      </div>
    </nav>
    <div id="scroll-progress" aria-hidden="true"></div>
  </header>

  <main id="main">
  </main>
</body>
</html>
